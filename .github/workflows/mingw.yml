name: MinGW

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # No inputs: this library builds on every rung of the ladder, which is what
  # the shared workflow defaults to. The WinLibs release lookup that used to
  # live here - including the deliberate soft-fail when no snapshot build has
  # been published between stable branches - now lives in cpp-ci's
  # install-winlibs action.
  mingw:
    uses: rhalbersma/cpp-ci/.github/workflows/mingw.yml@847e9ccde5651430e1dbe2cef53c85c1d3df0b90 # v0.6.1
