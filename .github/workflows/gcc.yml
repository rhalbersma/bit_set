name: GCC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow_ref }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
  # canary.yml calls this weekly, so the stub stays callable itself.
  workflow_call:

jobs:
  # No inputs: every rung, and the rungs move with cpp-ci rather than with a local matrix.
  gcc:
    uses: rhalbersma/cpp-ci/.github/workflows/gcc.yml@e2886b13f6fcd1eceb231652f816b016de41be1d # v0.8.1
