name: GCC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # No inputs: this library builds on every rung of the ladder, which is what
  # the shared workflow defaults to. The rungs it names move with cpp-ci, so
  # the local matrix's hardcoded 15/16/17-SVN is gone along with the two
  # install paths (apt for stable, kayari.org's .deb for trunk) and the
  # x64-linux-gcc-trunk overlay triplet that rebuilt the dependencies with
  # the trunk snapshot's own libstdc++.
  gcc:
    uses: rhalbersma/cpp-ci/.github/workflows/gcc.yml@847e9ccde5651430e1dbe2cef53c85c1d3df0b90 # v0.6.1
