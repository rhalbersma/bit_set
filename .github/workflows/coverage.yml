name: Coverage

# id-token for Codecov's tokenless upload; the shared workflow cannot exceed
# what is granted here.
permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # The Codecov CLI only queues an upload, so a report dropped on their side
  # greys the badge with every leg green; the daily re-upload self-heals that.
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  coverage:
    uses: rhalbersma/cpp-ci/.github/workflows/coverage.yml@676e6fb7abc784e54a227998bf3e9c39790e63cf # v0.8.0
    with:
      # benchmark/ as well as the shared default: unlike xstd, this
      # repository ships a benchmark tree, which measures the library rather
      # than being part of it and has no business in its coverage figure.
      exclude: "test/.* benchmark/.* build/.*"
      # Reported, not enforced. The 100/100 gate this repository inherited
      # from xstd is aspirational while the test suite is still being built
      # up - today's figure is ~85% of lines and ~60% of branches - and
      # .github/codecov.yml already marks both Codecov statuses
      # informational for exactly that reason. The local job said the same
      # thing with continue-on-error, which a job that calls a reusable
      # workflow cannot carry, so these two zeroes are what now keeps this
      # job reporting the real number rather than failing on a gap only new
      # tests can close. Raise them as coverage is built up.
      fail_under_line: 0
      fail_under_branch: 0
