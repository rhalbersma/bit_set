name: Coverage

# id-token for Codecov's tokenless upload; the shared workflow cannot exceed what is granted here.
permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  # The Codecov CLI only queues an upload, so the daily re-upload self-heals a report dropped on their side.
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:

jobs:
  coverage:
    # Ahead of v0.8.1, for the unwind-resume exclusion on a bare closing brace, without which 100 can never be met.
    uses: rhalbersma/cpp-ci/.github/workflows/coverage.yml@01ed3761196d7e019c6e0ed876d80974ee653ead # main
    with:
      # benchmark/ as well: it measures the library rather than being part of it.
      exclude: "test/.* benchmark/.* build/.*"
      # Enforced, not reported: code arriving without a test fails this job, and commenting the untested part out is how to land it.
      fail_under_line: 100
      fail_under_branch: 100
