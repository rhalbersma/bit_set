name: Sanitizers

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # No inputs: every leg on every rung its compiler fills. This replaces two
  # GCC-only legs with five across both compilers and both standard
  # libraries, and turns leak detection on - the local ASan leg ran with
  # detect_leaks=0.
  sanitizers:
    uses: rhalbersma/cpp-ci/.github/workflows/sanitizers.yml@761f20d7d737d4e0c5a942eb2f1becf8e8edea75 # v0.3.1
