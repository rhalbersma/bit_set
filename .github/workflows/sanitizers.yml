name: Sanitizers

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # No inputs: every leg on every rung its compiler fills. This replaces two
  # GCC-only legs with five across both compilers and both standard
  # libraries, and turns leak detection on - the local ASan leg ran with
  # detect_leaks=0.
  sanitizers:
    uses: rhalbersma/cpp-ci/.github/workflows/sanitizers.yml@76c73148793d7700b98b703f437e80d1eb0b1295 # v0.5.0
    with:
      # No ASan libc++ leg. Not because the sanitizer says anything different
      # there, but because this library does not compile against libc++ at all
      # - the same missing C++23 range adaptors that keep clang-libc++.yml red.
      # Those three legs cannot pass, and welding them to this workflow makes
      # its gate permanently red, which reports nothing about the twelve legs
      # that were meant to be green: a real ASan regression on GCC 16 would
      # look exactly like the gap that has been there all along. The libc++
      # coverage stays in clang-libc++.yml, where its own gate makes its own
      # red legible. Drop this the day libc++ catches up.
      libcxx_tiers: ""
