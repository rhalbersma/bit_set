name: MSVC

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # All three rungs, including VS 2022. The README keeps that leg on purpose,
  # "for reference only, to show exactly where it fails": VS 2022's MSVC STL
  # has no <flat_set>, which benchmark/src/set/sieve.cpp needs. VS 2026 is
  # the actual floor supported. The 2022 leg is deliberately not a required
  # status check, so its failure is visible without blocking a merge.
  #
  # 2026-Preview is new here - the local workflow's third leg was already
  # this, but the preview toolset install (channel manifest ETag cache and
  # all) now lives in cpp-ci's install-msvc-preview action.
  #
  # The toolset input is left at its default, which is the MSVC one.
  msvc:
    uses: rhalbersma/cpp-ci/.github/workflows/visual-studio.yml@d4dea1401d4e1ffc2e2b3d7b063cdc33c419d587 # v0.4.0
