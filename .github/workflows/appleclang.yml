name: AppleClang

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Two rungs, not three: Apple publishes no Clang trunk, and the shared
  # workflow drops the development rung with a notice rather than failing.
  #
  # Expected red on both, and documented as such in the README: AppleClang
  # ships libc++, which is missing the same C++23 range adaptors that keep
  # clang-libc++.yml red. Neither leg is a required status check, so the
  # failures stay visible without blocking a merge.
  #
  # This file keeps its name rather than following cpp-ci's apple-clang.yml:
  # the badge URL in the README is the workflow's path, so renaming it would
  # break the badge and every link to a past run.
  apple_clang:
    uses: rhalbersma/cpp-ci/.github/workflows/apple-clang.yml@0033891bc09c0ba200d597a3e5a619796c93e578 # v0.5.1
