name: AppleClang

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # Two rungs, Apple publishing no Clang trunk; the file keeps its name because the README badge is the workflow's path.
  apple_clang:
    uses: rhalbersma/cpp-ci/.github/workflows/apple-clang.yml@e2886b13f6fcd1eceb231652f816b016de41be1d # v0.8.1
