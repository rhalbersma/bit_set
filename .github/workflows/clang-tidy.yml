name: Clang-Tidy

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  clang_tidy:
    uses: rhalbersma/cpp-ci/.github/workflows/clang-tidy.yml@761f20d7d737d4e0c5a942eb2f1becf8e8edea75 # v0.3.1
    with:
      # The generated per-header units alone, as run-clang-tidy matches them
      # against the compile database's absolute paths. No sources_regex: the
      # Boost.Test macros drown the signal in noise, which is the same reason
      # the workflow this replaces passed only this pattern. Every public
      # header is a primary input either way, and .clang-tidy sets
      # WarningsAsErrors, so any finding fails the job.
      self_sufficiency_regex: ${{ github.workspace }}/build/test/header_self_sufficiency/.*
