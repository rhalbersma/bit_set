name: Clang

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # No inputs: every rung. The libc++ leg is its own workflow now; what is left here is the libstdc++ side.
  clang:
    uses: rhalbersma/cpp-ci/.github/workflows/clang.yml@e2886b13f6fcd1eceb231652f816b016de41be1d # v0.8.1
