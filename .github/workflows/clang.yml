name: Clang

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # No inputs: this library builds on every rung of the ladder, which is what
  # the shared workflow defaults to.
  #
  # The libc++ leg that used to ride along in this file's matrix is now its
  # own workflow (clang-libc++.yml), which is also where the note about the
  # C++23 range adaptors libc++ is still missing has moved to. What is left
  # here is the libstdc++ side, as before, and the shared ladder pairs each
  # Clang rung with a matching GCC rung for that libstdc++ rather than
  # pointing every rung at one version of it.
  clang:
    uses: rhalbersma/cpp-ci/.github/workflows/clang.yml@676e6fb7abc784e54a227998bf3e9c39790e63cf # v0.8.0
