name: Actionlint

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # New here: this repository had no workflow linting of its own. With almost
  # every workflow reduced to a "uses" stub there is much less left to get
  # wrong, but that cuts both ways - a typo in an input name or a broken pin
  # is now most of what a stub can contain. No inputs: the defaults lint
  # .github/workflows with shellcheck on.
  actionlint:
    uses: rhalbersma/cpp-ci/.github/workflows/actionlint.yml@847e9ccde5651430e1dbe2cef53c85c1d3df0b90 # v0.6.1
