name: Clang-CL

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # The same Visual Studio ladder as msvc.yml, with clang-cl in front of the
  # MSVC STL instead of cl. Its own cache prefix, since the two callers build
  # the dependencies with different compilers.
  #
  # Two rungs, not three. clang-cl uses the MSVC STL whatever the front end,
  # so VS 2022 fails here for the same missing <flat_set> as on msvc.yml -
  # but unlike msvc.yml this workflow never carried that leg, and the README
  # says so with a dash in the Clang-CL Older stable column. One reference
  # leg for that gap is enough; a second adds a runner and no information.
  # 2026-Preview is a gain: the local workflow tested VS 2026 alone.
  clang_cl:
    uses: rhalbersma/cpp-ci/.github/workflows/visual-studio.yml@676e6fb7abc784e54a227998bf3e9c39790e63cf # v0.8.0
    with:
      tiers: qualification,development
      toolset: ClangCL,host=x64
      preview_toolset_prefix: "ClangCL,"
      cache_prefix: clang-cl
