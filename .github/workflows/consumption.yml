name: Consumption

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  # The fifteenth stub, and the last to arrive. The shared workflow could not
  # express this library until cpp-ci v0.4.0: it configured with no toolchain
  # file and its own install prefix, which suits a library whose only
  # dependencies belong to its tests. Both inputs below are what this one
  # needs beyond that, and both default to off for the callers that don't.
  consumption:
    uses: rhalbersma/cpp-ci/.github/workflows/consumption.yml@d4dea1401d4e1ffc2e2b3d7b063cdc33c419d587 # v0.4.0
    with:
      # CMakeLists.txt does an unconditional
      # find_package(boost_hash2 CONFIG REQUIRED), so even the
      # -DBUILD_TESTING=OFF configure needs vcpkg here - and so does each of
      # the three consumers, since the installed package find_dependency's it
      # straight back.
      vcpkg: true
      # The same revision CMakeLists.txt pins for its FetchContent fallback.
      # An installed xstd rather than that fallback is what the find_package
      # model actually requires: install(EXPORT) cannot export a FetchContent
      # build tree, so without this the package this library installs is
      # invalid and the consumer fails to configure against it.
      dependency_repos: |
        https://github.com/rhalbersma/xstd.git 7f7cbdd6e4174107ea062484f31c81fbfe220f7a
