name: Scorecard

# Read-only at workflow level. The write grants the analysis needs are on the
# job below rather than here: the OpenSSF webapp that ingests published
# results verifies a workflow file first, and for a job that calls a reusable
# workflow the path in the OIDC certificate names the shared workflow, not
# this stub - so this placement is least privilege rather than a requirement.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main ]
  branch_protection_rule:
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:

jobs:
  scorecard:
    permissions:
      contents: read
      security-events: write
      id-token: write
      actions: read
    uses: rhalbersma/cpp-ci/.github/workflows/scorecard.yml@d42a31ce27a752910b7b76cc6e3368735c8a1115 # v0.4.1
