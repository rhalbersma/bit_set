version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    # One PR per month for the whole ecosystem: a codeql-action bump is three actions from one repository, none mergeable alone.
    groups:
      actions:
        patterns:
          - "*"
