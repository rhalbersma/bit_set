# Mirrors the --fail-under-line 100 and --fail-under-branch 100 gates the
# Coverage workflow enforces (see .github/workflows/coverage.yml), the same
# bar xstd meets. Both statuses were informational while the test suite was
# being built up; it now reaches every line and branch of the library that a
# test can reach, so they block like the workflow does.
coverage:
  status:
    project:
      default:
        target: 100%
        threshold: 0%
    patch:
      default:
        target: 100%
        threshold: 0%

comment: false
